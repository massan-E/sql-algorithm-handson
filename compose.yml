services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: handson
    command: --innodb-buffer-pool-size=512M
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 2s
      timeout: 5s
      retries: 60

  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: sleep infinity
    init: true

volumes:
  db-data:
